    // ========================================================
    // 2. CONTEXTO DE AUTENTICACIÓN (HU-04 & AJUSTE TÉCNICO 1)
    // ========================================================
    const AuthContext = createContext();

    function AuthProvider({ children }) {
      const STORAGE_KEY = 'robles_auth_session_v1';
      const [user, setUser] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          return saved ? JSON.parse(saved) : null;
        } catch (e) {
          return null;
        }
      });
      const [authError, setAuthError] = useState(null);

      useEffect(() => {
        try {
          if (user) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(user));
          } else {
            localStorage.removeItem(STORAGE_KEY);
          }
        } catch (e) {}
      }, [user]);

      const login = (email, password) => {
        setAuthError(null);
        const norm = email.trim().toLowerCase();
        const entry = USERS_DB[norm];
        if (!entry) {
          setAuthError('No existe una cuenta registrada con este correo electrónico.');
          return false;
        }
        if (entry.password !== password) {
          setAuthError('Contraseña incorrecta. Por favor verifica tus credenciales.');
          return false;
        }
        setUser(entry.user);
        return true;
      };

      const logout = () => {
        setUser(null);
        setAuthError(null);
        localStorage.removeItem(STORAGE_KEY);
      };

      const toggleSimulatedRole = () => {
        if (!user) return;
        const target = user.rol === 'Colono' ? 'admin@robles.com' : 'colono@robles.com';
        setUser(USERS_DB[target].user);
      };

      return (
        <AuthContext.Provider value={{ user, isAuthenticated: Boolean(user), login, logout, authError, setAuthError, toggleSimulatedRole }}>
          {children}
        </AuthContext.Provider>
      );
    }

    function useAuth() {
      return useContext(AuthContext);
    }

    // ========================================================
    // 4. MODAL SUBIR COMPROBANTE (AJUSTE TÉCNICO 3)
    // ========================================================
    function SubirComprobanteModal({ isOpen, onClose, cuotasPendientes, cuotaPreseleccionada, onSubir }) {
      const [selectedCuotaId, setSelectedCuotaId] = useState('');
      const [fileName, setFileName] = useState('');
      const [fileSize, setFileSize] = useState('');
      const [referencia, setReferencia] = useState('');
      const [nota, setNota] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');

      useEffect(() => {
        if (cuotaPreseleccionada) {
          setSelectedCuotaId(cuotaPreseleccionada.id);
        } else if (cuotasPendientes.length > 0) {
          setSelectedCuotaId(cuotasPendientes[0].id);
        }
      }, [cuotaPreseleccionada, cuotasPendientes, isOpen]);

      if (!isOpen) return null;

      const handleFileChange = (e) => {
        const file = e.target.files[0];
        if (file) {
          setFileName(file.name);
          setFileSize((file.size / (1024 * 1024)).toFixed(2) + ' MB');
          setErrorMsg('');
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!selectedCuotaId) {
          setErrorMsg('Selecciona una cuota a pagar.');
          return;
        }
        if (!fileName) {
          setErrorMsg('Por favor adjunta el archivo del comprobante.');
          return;
        }

        setIsSubmitting(true);
        setTimeout(() => {
          onSubir({
            cuotaId: selectedCuotaId,
            nombreArchivo: fileName,
            referencia: referencia || 'SPEI-' + Math.floor(100000 + Math.random() * 900000),
            nota: nota || 'Comprobante reportado por el colono.'
          });
          setIsSubmitting(false);
          onClose();
        }, 400);
      };

      const cuotaSeleccionada = cuotasPendientes.find(c => c.id === selectedCuotaId);

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 sm:p-6" role="dialog">
          <div className="bg-white w-full max-w-lg rounded-3xl shadow-2xl border border-slate-200 overflow-hidden relative">
            <div className="px-6 py-5 bg-gradient-to-r from-robles-900 to-robles-800 text-white flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-robles-700/60 flex items-center justify-center text-robles-200">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                  </svg>
                </div>
                <div>
                  <h3 className="font-display text-lg font-bold">Subir Comprobante de Pago</h3>
                  <p className="text-xs text-robles-200">Validación bancaria en menos de 24h hábiles</p>
                </div>
              </div>
              <button onClick={onClose} className="p-1.5 rounded-lg text-robles-300 hover:text-white transition">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="p-6 sm:p-7 space-y-4">
              {errorMsg && (
                <div className="p-3 bg-rose-50 border border-rose-200 rounded-xl text-xs text-rose-700">
                  {errorMsg}
                </div>
              )}

              <div>
                <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">
                  Concepto / Cuota a Liquidar <span className="text-rose-500">*</span>
                </label>
                <select
                  value={selectedCuotaId}
                  onChange={(e) => setSelectedCuotaId(e.target.value)}
                  className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:border-robles-600 bg-slate-50/50 outline-none"
                >
                  {cuotasPendientes.map((c) => (
                    <option key={c.id} value={c.id}>
                      {c.concepto} — ${c.monto.toLocaleString('es-MX', { minimumFractionDigits: 2 })} MXN ({c.estado})
                    </option>
                  ))}
                </select>
                {cuotaSeleccionada && (
                  <p className="mt-1 text-xs text-slate-500">
                    Monto: <strong className="text-slate-800">${cuotaSeleccionada.monto.toLocaleString('es-MX', { minimumFractionDigits: 2 })} MXN</strong> • Vence: {cuotaSeleccionada.fechaLimite}
                  </p>
                )}
              </div>

              <div>

                  Archivo del Comprobante <span className="text-rose-500">*</span>
                </label>

                  />
                  <div className="flex flex-col items-center">

                      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />

                        <p className="text-[11px] text-slate-500">{fileSize} • Archivo seleccionado</p>
                      </div>
                    ) : (
                      <div>
                        <p className="text-xs font-semibold text-slate-700">Arrastra tu comprobante o <span className="text-robles-700 font-bold">haz clic aquí</span></p>
                        <p className="text-[11px] text-slate-400 mt-0.5">Formatos: PDF, JPG, PNG (Máx 10 MB)</p>
                      </div>
                    )}
                  </div>
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">
                  Clave de Rastreo o Folio Bancario
                </label>
                <input
                  type="text"
                  placeholder="Ej: SPEI-892100"
                  value={referencia}
                  onChange={(e) => setReferencia(e.target.value)}
                  className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:border-robles-600 bg-slate-50/50 outline-none"
                />
              </div>

              <div>
                <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">
                  Nota o Comentario
                </label>
                <textarea
                  rows="2"
                  placeholder="Ej: Transferencia realizada desde cuenta titular..."
                  value={nota}
                  onChange={(e) => setNota(e.target.value)}
                  className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:border-robles-600 bg-slate-50/50 outline-none"
                ></textarea>
              </div>

              <div className="pt-3 flex items-center justify-end gap-3 border-t border-slate-100">
                <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100">
                  Cancelar
                </button>
                <button
                  type="submit"
                  disabled={isSubmitting}
                  className="px-5 py-2.5 rounded-xl text-xs font-bold bg-robles-700 hover:bg-robles-800 text-white shadow-md transition"
                >
                  {isSubmitting ? 'Enviando...' : 'Enviar para Validación'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );

      const showToast = (msg) => {
        setToastMensaje(msg);
        setTimeout(() => setToastMensaje(null), 4000);

      const handleComprobanteSubido = ({ cuotaId, nombreArchivo, referencia, nota }) => {
        setFinanzas(prev => {
          const updatedMovimientos = prev.movimientos.map(mov => {
            if (mov.id === cuotaId) {
              return {
                ...mov,
                estado: 'En Revisión',
                comprobante: {
                  nombre: nombreArchivo,
                  fechaSubida: new Date().toLocaleDateString('es-MX') + ' ' + new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }),
                  referencia,
                  nota
                }
              };
            }
            return mov;
          });
          return { ...prev, movimientos: updatedMovimientos };
        });
        showToast('¡Comprobante adjuntado con éxito! El estado cambió a "En Revisión".');
      };

      const handleAprobarPagoAdmin = (movId) => {
        setFinanzas(prev => {
          let montoAprobado = 0;
          let movAprobado = null;
          const updatedMovimientos = prev.movimientos.map(mov => {
            if (mov.id === movId) {
              montoAprobado = mov.monto;
              movAprobado = mov;
              return { ...mov, estado: 'Pagado' };
            }
            return mov;
          });

          const nuevoSaldo = Math.max(0, prev.resumen.saldoPendiente - montoAprobado);

          return {
            ...prev,
            resumen: {
              ...prev.resumen,
              saldoPendiente: nuevoSaldo,
              ultimoPago: {
                monto: movAprobado ? movAprobado.monto : prev.resumen.ultimoPago.monto,
                fecha: new Date().toLocaleDateString('es-MX'),

                    <div>
                      <p className="font-bold">Tu voto ({votoSeleccionado}) ha sido registrado exitosamente.</p>
                      <p className="text-xs text-emerald-700 mt-0.5">Asignado formalmente al {user?.lote}. Gracias por participar.</p>
                    </div>
                  </div>
                )}
              </div>
            </div>
          ))}

          {user?.rol === 'Admin' && (
            <div className="bg-white rounded-3xl border-2 border-blue-200 p-6 sm:p-7 shadow-sm">
              <h3 className="font-display text-base font-bold text-slate-900 mb-1">
                Panel Administrativo: Convocar Nueva Consulta
              </h3>
              <p className="text-xs text-slate-500 mb-4">Como Administrador puedes publicar temas de interés condominal.</p>
              <form onSubmit={handleCrear} className="space-y-3">
                <input
                  type="text"
                  value={nuevaConsulta}
                  onChange={(e) => setNuevaConsulta(e.target.value)}
                  placeholder="Ej: Modificación del horario de áreas comunes..."
                  className="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm outline-none"
                />
                <button type="submit" className="px-5 py-2.5 rounded-xl bg-blue-600 text-white text-xs font-bold">
                  Publicar Votación
                </button>
              </form>
            </div>
          )}
        </div>
      );
    }

    // ========================================================
    // 7. MÓDULO DE INCIDENCIAS (HU-03)
    // ========================================================
    function Incidencias() {
      const [reportes, setReportes] = useState([
        { id: 'INC-801', tipo: 'Alumbrado', desc: 'Luminaria apagada en Calle Roble #4 cerca de área verde.', estatus: 'En Proceso', fecha: '02/10/2026' },
        { id: 'INC-798', tipo: 'Seguridad / Portón', desc: 'Sensor de cierre automático con retraso intermitente.', estatus: 'Resuelto', fecha: '28/09/2026' }
      ]);
      const [tipo, setTipo] = useState('Mantenimiento General');
      const [desc, setDesc] = useState('');
      const [enviado, setEnviado] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!desc.trim()) return;
        const nuevo = {
          id: 'INC-' + Math.floor(802 + Math.random() * 50),
          tipo,
          desc,
          estatus: 'Recibido',
          fecha: new Date().toLocaleDateString('es-MX')
        };
        setReportes([nuevo, ...reportes]);
        setDesc('');
        setEnviado(true);
        setTimeout(() => setEnviado(false), 4000);
      };

      return (
        <div className="space-y-8">
          <div className="pb-2 border-b border-slate-200">
            <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-100 text-amber-800 text-xs font-bold uppercase tracking-wider mb-2">
              <span>HU-03</span>
              <span>•</span>
              <span>Reportes Comunitarios</span>
            </div>
            <h2 className="font-display text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">
              Incidencias y Reportes
            </h2>
            <p className="text-sm text-slate-500 mt-1">Reporta anomalías en áreas comunes o emergencias con seguimiento en tiempo real.</p>
          </div>

          {enviado && (
            <div className="p-4 bg-emerald-50 border border-emerald-200 rounded-2xl text-emerald-800 text-sm font-semibold flex items-center gap-2">
              <span>✓</span>
              <span>Reporte registrado exitosamente. Se ha notificado al personal de mantenimiento.</span>
            </div>
          )}

          <div className="bg-white rounded-3xl border border-slate-200 p-6 sm:p-7 shadow-sm">
            <h3 className="font-display text-lg font-bold text-slate-900 mb-4">Levantar Nuevo Reporte de Falla</h3>
            <form onSubmit={handleSubmit} className="space-y-4">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Tipo de Incidencia</label>
                  <select
                    value={tipo}
                    onChange={(e) => setTipo(e.target.value)}
                    className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm outline-none bg-slate-50/50"
                  >
                    <option>Mantenimiento General</option>
                    <option>Seguridad / Portón</option>
                    <option>Jardinería / Áreas Verdes</option>
                    <option>Alumbrado Público</option>
                    <option>Fuga de Agua / Fontanería</option>
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Evidencia Fotográfica</label>
                  <input type="file" className="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:bg-robles-50 file:text-robles-700" />
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Descripción</label>
                <textarea
                  required
                  rows="3"
                  value={desc}
                  onChange={(e) => setDesc(e.target.value)}
                  placeholder="Describe la ubicación exacta y el desperfecto..."
                  className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm outline-none bg-slate-50/50"
                ></textarea>
              </div>

              <button type="submit" className="px-6 py-2.5 rounded-xl bg-robles-700 text-white font-bold text-xs shadow-md">
                Enviar Reporte
              </button>
            </form>
          </div>

          <div className="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
            <div className="p-5 border-b border-slate-200 font-bold text-slate-900">Historial de Incidencias</div>
            <div className="overflow-x-auto">
              <table className="w-full text-left text-sm">
                <thead>
                  <tr className="bg-slate-50 text-[11px] font-bold uppercase text-slate-500 border-b border-slate-200">
                    <th className="py-3 px-5">Folio</th>
                    <th className="py-3 px-5">Tipo</th>
                    <th className="py-3 px-5">Descripción</th>
                    <th className="py-3 px-5">Fecha</th>
                    <th className="py-3 px-5 text-right">Estatus</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {reportes.map((r) => (
                    <tr key={r.id}>
                      <td className="py-3.5 px-5 font-mono font-bold text-xs">{r.id}</td>
                      <td className="py-3.5 px-5 font-medium">{r.tipo}</td>
                      <td className="py-3.5 px-5 text-slate-600 text-xs">{r.desc}</td>
                      <td className="py-3.5 px-5 text-slate-500 text-xs">{r.fecha}</td>
                      <td className="py-3.5 px-5 text-right">
                        <span className="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-amber-100 text-amber-800">{r.estatus}</span>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // ========================================================
    // 8. LAYOUT Y NAVBAR (HU-05)
    // ========================================================
    function Navbar({ activeTab, setActiveTab }) {
      const { user, logout, toggleSimulatedRole } = useAuth();
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      const navLinks = [
        { id: 'finanzas', label: 'Mis Finanzas (HU-01)', icon: '💳' },
        { id: 'votaciones', label: 'Votaciones (HU-02)', icon: '🗳️' },
        { id: 'incidencias', label: 'Incidencias (HU-03)', icon: '🛠️' },
      ];

      return (
        <header className="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-slate-200">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex items-center justify-between h-16 sm:h-20">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 sm:w-11 sm:h-11 rounded-2xl bg-gradient-to-tr from-robles-800 to-robles-600 flex items-center justify-center text-white shadow-md">
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                  </svg>
                </div>
                <div>
                  <div className="font-display font-extrabold text-lg sm:text-xl text-slate-900 flex items-center gap-1.5">
                    <span>Residencial</span>
                    <span className="text-robles-700">Los Robles</span>
                  </div>
                  <p className="text-[11px] font-medium text-slate-500 uppercase tracking-wider hidden sm:block">
                    Sistema Único de Información
                  </p>
                </div>
              </div>

              <nav className="hidden md:flex items-center gap-1 bg-slate-100/80 p-1.5 rounded-2xl border border-slate-200/80">
                {navLinks.map((tab) => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`px-3.5 py-2 rounded-xl text-xs font-semibold transition ${
                      activeTab === tab.id ? 'bg-white text-robles-800 shadow-sm' : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    <span>{tab.icon}</span> <span className="ml-1.5">{tab.label}</span>
                  </button>
                ))}
              </nav>

              <div className="hidden lg:flex items-center gap-3">
                <button
                  onClick={toggleSimulatedRole}
                  className="text-xs px-2.5 py-1.5 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-100 transition"
                  title="Cambiar entre Colono y Admin"
                >
                  <span>🔄 Probar Rol:</span> <strong className="text-slate-800">{user.rol === 'Colono' ? 'Admin' : 'Colono'}</strong>
                </button>

                <div className="flex items-center gap-2.5 pl-2 border-l border-slate-200">
                  <div className="w-9 h-9 rounded-full bg-slate-100 border border-slate-300 flex items-center justify-center font-bold text-xs text-slate-700">
                    {user?.rol === 'Admin' ? 'AD' : 'JE'}
                  </div>
                  <div className="text-left">
                    <div className="text-xs font-bold text-slate-900 flex items-center gap-1.5">
                      <span className="truncate max-w-[130px]">{user?.nombre}</span>
                      <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold uppercase ${
                        user?.rol === 'Admin' ? 'bg-blue-100 text-blue-800' : 'bg-emerald-100 text-emerald-800'
                      }`}>
                        {user?.rol}
                      </span>
                    </div>
                    <div className="text-[11px] text-slate-500 font-medium">{user?.lote}</div>
                  </div>
                </div>

                <button onClick={logout} className="p-2 text-slate-500 hover:text-rose-600 hover:bg-rose-50 rounded-xl transition" title="Cerrar sesión">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                  </svg>
                </button>
              </div>

              <div className="flex lg:hidden items-center gap-2">
                <button
                  onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                  className="p-2.5 rounded-xl text-slate-600 hover:bg-slate-100"
                >
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" />
                  </svg>
                </button>
              </div>
            </div>
          </div>

          {mobileMenuOpen && (
            <div className="lg:hidden border-t border-slate-200 bg-white px-4 pt-3 pb-6 space-y-4 shadow-xl">
              <div className="p-3 bg-slate-50 rounded-2xl border border-slate-200 flex items-center justify-between">
                <div>
                  <div className="text-xs font-bold text-slate-900">{user?.nombre}</div>
                  <div className="text-[11px] text-slate-500">{user?.lote} • Rol: <span className="font-semibold text-robles-700">{user?.rol}</span></div>
                </div>
                <button onClick={toggleSimulatedRole} className="text-xs px-2.5 py-1 rounded-lg bg-white border border-slate-300 font-semibold text-slate-700">
                  Cambiar Rol
                </button>
              </div>

              <div className="space-y-1">
                {navLinks.map((tab) => (
                  <button
                    key={tab.id}
                    onClick={() => { setActiveTab(tab.id); setMobileMenuOpen(false); }}
                    className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold text-left transition ${
                      activeTab === tab.id ? 'bg-robles-50 text-robles-800 border border-robles-200' : 'text-slate-700 hover:bg-slate-100'
                    }`}
                  >
                    <span>{tab.icon}</span> <span>{tab.label}</span>
                  </button>
                ))}
              </div>

              <div className="pt-2 border-t border-slate-200">
                <button onClick={logout} className="w-full py-2.5 rounded-xl text-sm font-bold text-rose-700 bg-rose-50 text-center">
                  Cerrar Sesión
                </button>
              </div>
            </div>
          )}
        </header>
      );
    }

    function DashboardLayout({ activeTab, setActiveTab, children }) {
      const { user } = useAuth();

      const navigationItems = [
        { id: 'finanzas', name: 'Mis Finanzas', badge: 'HU-01', icon: '💳', description: 'Estados de cuenta y comprobantes' },
        { id: 'votaciones', name: 'Votaciones', badge: 'HU-02', icon: '🗳️', description: '1 voto por lote/inmueble' },
        { id: 'incidencias', name: 'Incidencias', badge: 'HU-03', icon: '🛠️', description: 'Fallas comunes y reportes' }
      ];

      return (
        <div className="min-h-screen bg-slate-50 flex flex-col">
          <Navbar activeTab={activeTab} setActiveTab={setActiveTab} />

          <div className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 flex flex-col md:flex-row gap-8">
            <aside className="hidden md:block w-64 lg:w-72 flex-shrink-0">
              <div className="sticky top-28 space-y-6">
                <div className="p-5 rounded-3xl bg-white border border-slate-200/90 shadow-sm">
                  <div className="flex items-center gap-3">
                    <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-robles-800 to-robles-600 text-white flex items-center justify-center font-bold text-base shadow-sm">
                      {user?.rol === 'Admin' ? 'AD' : 'JE'}
                    </div>
                    <div className="min-w-0 flex-1">
                      <h3 className="font-bold text-sm text-slate-900 truncate">{user?.nombre}</h3>
                      <p className="text-xs text-slate-500 font-medium">{user?.lote}</p>
                      <span className={`inline-block mt-1 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase ${
                        user?.rol === 'Admin' ? 'bg-blue-100 text-blue-800' : 'bg-emerald-100 text-emerald-800'
                      }`}>
                        Rol {user?.rol}
                      </span>
                    </div>
                  </div>
                </div>

                <nav className="p-3 bg-white rounded-3xl border border-slate-200/90 shadow-sm space-y-1.5">
                  <p className="px-3 pt-2 pb-1 text-[10px] font-extrabold uppercase tracking-wider text-slate-400">
                    Módulos del Sistema
                  </p>
                  {navigationItems.map((item) => {
                    const isActive = activeTab === item.id;
                    return (
                      <button
                        key={item.id}
                        onClick={() => setActiveTab(item.id)}
                        className={`w-full text-left p-3 rounded-2xl transition flex items-start gap-3 ${
                          isActive ? 'bg-robles-50 text-robles-900 font-bold border border-robles-200/80 shadow-sm' : 'text-slate-600 hover:bg-slate-50'
                        }`}
                      >
                        <span className="text-lg">{item.icon}</span>
                        <div className="min-w-0 flex-1">
                          <div className="flex items-center justify-between">
                            <span className="text-xs font-bold">{item.name}</span>
                            <span className="text-[9px] font-mono px-1.5 py-0.5 rounded bg-slate-100 text-slate-500 font-bold">{item.badge}</span>
                          </div>
                          <p className="text-[11px] text-slate-400 font-normal truncate mt-0.5">{item.description}</p>
                        </div>
                      </button>
                    );
                  })}
                </nav>

                <div className="p-4 rounded-2xl bg-gradient-to-br from-slate-800 to-slate-900 text-white text-xs">
                  <div className="text-robles-400 font-bold mb-1">Caseta de Vigilancia 24/7</div>
                  <p className="text-slate-300 text-[11px]">Emergencias o accesos: <br /><strong className="text-white">Ext. 101 • 55 1200 8099</strong></p>
                </div>
              </div>
            </aside>

            <main className="flex-1 min-w-0">
              {children}
            </main>
          </div>

          <footer className="mt-auto bg-white border-t border-slate-200 py-6 text-xs text-slate-500 text-center">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
              <p>© 2026 Residencial Los Robles • Sistema Único de Información (Sprint 1 Review)</p>
              <p className="text-slate-400">Diseño Responsivo Mobile-First • React + Tailwind CSS</p>
            </div>
          </footer>
        </div>
      );
    }

    // ========================================================
    // 9. APLICACIÓN PRINCIPAL
    // ========================================================
    function MainApp() {
      const { isAuthenticated } = useAuth();
      const [activeTab, setActiveTab] = useState('finanzas');

      if (!isAuthenticated) {
        return <LoginForm />;
      }

      return (
        <DashboardLayout activeTab={activeTab} setActiveTab={setActiveTab}>
          {activeTab === 'finanzas' && <EstadoCuenta />}
          {activeTab === 'votaciones' && <Votaciones />}
          {activeTab === 'incidencias' && <Incidencias />}
        </DashboardLayout>
      );
    }

    function App() {
      return (
        <AuthProvider>
          <MainApp />
        </AuthProvider>
      );
    }

    // Montar la aplicación en el DOM
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
